<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin — Kualitas Udara Kelurahan Buluri</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Inter', ui-sans-serif, system-ui, sans-serif; }

        /* Latar aurora — sama dengan base.html */
        .aurora {
            position: fixed; inset: 0; z-index: -10; pointer-events: none;
            background:
                radial-gradient(60rem 32rem at 12% -8%,  rgba(16,185,129,0.16), transparent 60%),
                radial-gradient(52rem 30rem at 92% 8%,   rgba(20,184,166,0.11), transparent 60%),
                radial-gradient(44rem 26rem at 50% 112%, rgba(132,204,22,0.09), transparent 60%),
                #020617;
        }

        .card-glass {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(148, 163, 184, 0.14);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
        }

        @keyframes rise-in {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }
        .rise-in { animation: rise-in .45s ease both; }

        /* Efek fokus input */
        .input-field:focus {
            outline: none;
            border-color: rgba(52, 211, 153, 0.6);
            box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.12);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-center px-4">

    <!-- Latar aurora -->
    <div class="aurora"></div>

    <!-- ===== KARTU LOGIN ===== -->
    <div class="w-full max-w-sm rise-in">

        <!-- Logo / Header -->
        <div class="text-center mb-8">
            <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-emerald-500/10 border border-emerald-500/30 mb-4 text-3xl">
                🌿
            </div>
            <h1 class="text-2xl font-extrabold text-white">
                <span class="bg-gradient-to-r from-emerald-300 to-lime-300 bg-clip-text text-transparent">Kualitas Udara Kelurahan Buluri</span>
            </h1>
            <p class="text-slate-400 text-sm mt-1">Kota Palu, Sulawesi Tengah</p>
            <p class="text-slate-500 text-xs mt-1">Masuk sebagai administrator</p>
        </div>

        <!-- Form -->
        <div class="card-glass rounded-2xl p-7">

            <!-- Error alert -->
            {% if error %}
            <div class="flex items-center gap-3 bg-red-500/10 border border-red-500/30 text-red-300 text-sm rounded-xl px-4 py-3 mb-5">
                <span class="text-lg flex-shrink-0">⚠️</span>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form method="POST" action="{{ url_for('pages.login', next=request.args.get('next', '')) }}" autocomplete="off">

                <!-- Username -->
                <div class="mb-4">
                    <label for="username" class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">
                        Username
                    </label>
                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="admin"
                        class="input-field w-full bg-slate-800/60 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white placeholder-slate-600 transition"
                        autofocus
                        required
                    >
                </div>

                <!-- Password -->
                <div class="mb-6">
                    <label for="password" class="block text-xs font-semibold text-slate-400 uppercase tracking-widest mb-2">
                        Password
                    </label>
                    <div class="relative">
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="••••••••"
                            class="input-field w-full bg-slate-800/60 border border-slate-700 rounded-xl px-4 py-3 pr-12 text-sm text-white placeholder-slate-600 transition"
                            required
                        >
                        <!-- Toggle tampilkan password -->
                        <button
                            type="button"
                            id="btn-toggle-pw"
                            class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-500 hover:text-slate-300 transition text-lg"
                            tabindex="-1"
                            aria-label="Tampilkan/sembunyikan password"
                        >👁️</button>
                    </div>
                </div>

                <!-- Tombol Login -->
                <button
                    type="submit"
                    class="w-full bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-white font-semibold rounded-xl py-3 text-sm transition duration-150"
                >
                    Masuk ke Dashboard
                </button>

            </form>
        </div>

        <!-- Link kembali ke halaman publik -->
        <p class="text-center text-xs text-slate-600 mt-5">
            <a href="{{ url_for('pages.publik') }}" class="text-slate-400 hover:text-emerald-400 transition">
                ← Kembali ke Halaman Publik
            </a>
        </p>

        <!-- Footer kecil -->
        <p class="text-center text-[11px] text-slate-700 mt-4">
            Kualitas Udara Kelurahan Buluri · Skripsi Moh. Fadlan Darul Aksa Nusu · STMIK Bina Mulia Palu
        </p>
    </div>

    <script>
        // Toggle lihat/sembunyikan password
        const btnToggle = document.getElementById('btn-toggle-pw');
        const pwInput   = document.getElementById('password');
        btnToggle.addEventListener('click', () => {
            if (pwInput.type === 'password') {
                pwInput.type = 'text';
                btnToggle.textContent = '🙈';
            } else {
                pwInput.type = 'password';
                btnToggle.textContent = '👁️';
            }
        });
    </script>
</body>
</html>
